<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body>
    <input type="file" id="pdf" accept="application/pdf" />
    <button id="gen">Générer</button>

    <script type="module">
      import { PDFDocument } from "https://cdn.skypack.dev/pdf-lib";

      const flight = {
        station: "BOD",
        arrFlightNumber: "W6 1234",
        arrDate: "04/02/2026",
        reg: "HA-LWK",
        arrivalInspector: "Hugo",
        depFlightNumber: "W6 5678",
        depDate: "04/02/2026",
        departureInspector: "Hugo",
      };

      async function fill(templateBytes, data) {
        const pdfDoc = await PDFDocument.load(templateBytes);
        const form = pdfDoc.getForm();

        form.getTextField("station").setText(data.station);
        form.getTextField("Arival flihht number").setText(data.arrFlightNumber);
        form.getTextField("date x").setText(data.arrDate);
        form.getTextField("reg").setText(data.reg);

        form.getTextField("nam x").setText(data.arrivalInspector);

        form.getTextField("departure").setText(data.depFlightNumber);
        form.getTextField("date x2").setText(data.depDate);
        form.getTextField("nam x 1").setText(data.departureInspector);

        // Pour imprimer sans soucis (texte “figé”)
        form.flatten();

        return await pdfDoc.save();
      }

      function download(bytes, filename) {
        const blob = new Blob([bytes], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      document.getElementById("gen").onclick = async () => {
        const file = document.getElementById("pdf").files?.[0];
        if (!file) return alert("Choisis le PDF template.");

        const bytes = await file.arrayBuffer();
        const out = await fill(bytes, flight);
        download(out, "WAIF_filled.pdf");
      };
    </script>
  </body>
</html>
