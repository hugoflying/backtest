<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <!-- anti-flash : applique le thème sauvegardé AVANT le rendu -->
  <script>
    (function(){
      const t = localStorage.getItem("theme");
      if(t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <meta charset="utf-8">
  <title>Préparation des vols</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* =========================
     TYPOGRAPHY SYSTEM
     ========================= */
  body,
  .title,
  .subtitle,
  .label,
  .help,
  .button,
  .box,
  .vol-header{
    font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  /* Inputs + selects = JetBrains Mono */
  input,
  select,
  textarea,
  #ak_flight_1, #ak_flight_2,
  #ak_flight_1 option, #ak_flight_2 option{
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                 "Liberation Mono", "Courier New", monospace;
    font-variant-numeric: tabular-nums;
  }

  /* =========================
     AK overlay
     ========================= */
  #akBackdrop{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    z-index: 4600;
  }

  #akPopover{
    position: fixed;
    inset: 10px;
    background: #fff;
    border-radius: 16px;
    z-index: 4700;
    padding: 12px;
    overflow: auto;
    box-shadow: 0 10px 28px rgba(0,0,0,.08);
    border: 1px solid rgba(0,0,0,.08);
  }

  #akPopover .ak-header{
    position: sticky;
    top: 0;
    z-index: 2;
    background: #fff;
    padding: 10px 0;
    border-bottom: 1px solid rgba(0,0,0,.08);
  }

  /* =========================
     Docs grid + band buttons
     ========================= */
  .doc-grid{
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .doc-grid .button{
    width: 100%;
    min-height: 44px;
    white-space: nowrap;
    justify-content: flex-start;
  }

  .btn-band{
    position: relative;
    padding-left: 18px;
    overflow: hidden;
  }

  .btn-band::before{
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    background: #6b7280;
  }

  .band-ryanair::before{ background: #ECC532; }
  .band-lauda::before  { background: #E71B43; }
  .band-presta::before { background: #C6E0B4; }

  .band-gradient::before{
    background: linear-gradient(180deg, #C3017E 0%, #0E058E 100%);
  }

  /* =========================
     AK dropdown alignment
     ========================= */
  #ak_flight_1, #ak_flight_2,
  #ak_flight_1 option, #ak_flight_2 option{
    white-space: pre;
  }

  /* =========================
     Center headers + badges
     ========================= */
  .box h2.title,
  .box h3.title{
    text-align: center;
  }

  #arr_badges_1,
  #dep_badges_1,
  #arr_badges_2,
  #dep_badges_2{
    display: flex;
    justify-content: center;
  }

  /* =========================
     iOS Glass buttons — MODE NUIT (défaut)
     ========================= */
  .button.btn-band{
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    color: rgba(255,255,255,.92) !important;
    text-shadow: 0 1px 0 rgba(0,0,0,.25);
    background: rgba(255,255,255,.08) !important;
    border: 1px solid rgba(255,255,255,.14) !important;
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-shadow:
      0 10px 20px rgba(0,0,0,.30),
      inset 0 1px 0 rgba(255,255,255,.10);
    transition:
      transform .14s ease,
      box-shadow .14s ease,
      border-color .14s ease,
      background .14s ease,
      color .14s ease;
  }

  .button.btn-band::after{
    content:"";
    position:absolute;
    left: 10px;
    right: 10px;
    top: 8px;
    height: 40%;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0));
    pointer-events:none;
    opacity: .7;
  }

  .button.btn-band:hover{
    transform: translateY(-1px);
    border-color: rgba(255,255,255,.18) !important;
    background: rgba(255,255,255,.10) !important;
    box-shadow:
      0 14px 26px rgba(0,0,0,.34),
      inset 0 1px 0 rgba(255,255,255,.12);
  }

  .button.btn-band:active{
    transform: translateY(0);
    background: rgba(255,255,255,.07) !important;
    box-shadow:
      0 8px 16px rgba(0,0,0,.34),
      inset 0 2px 6px rgba(0,0,0,.25);
  }

  .button.btn-band:focus-visible{
    outline: none;
    box-shadow:
      0 0 0 3px rgba(59,130,246,.35),
      0 14px 26px rgba(0,0,0,.34),
      inset 0 1px 0 rgba(255,255,255,.12);
  }

  /* MODE JOUR — fond blanc avec relief */
  [data-theme="light"] .button.btn-band{
    color: #1e293b !important;
    text-shadow: none;
    background: #ffffff !important;
    border: 1px solid rgba(0,0,0,.13) !important;
    box-shadow:
      0 1px 0 rgba(0,0,0,.06),
      0 4px 10px rgba(0,0,0,.09),
      inset 0 1px 0 rgba(255,255,255,1),
      inset 0 -1px 0 rgba(0,0,0,.05);
  }

  [data-theme="light"] .button.btn-band::before{
    opacity: 1;
  }

  [data-theme="light"] .button.btn-band::after{
    background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0));
  }

  [data-theme="light"] .button.btn-band:hover{
    transform: translateY(-1px);
    background: #ffffff !important;
    border-color: rgba(0,0,0,.18) !important;
    box-shadow:
      0 2px 0 rgba(0,0,0,.06),
      0 8px 18px rgba(0,0,0,.11),
      inset 0 1px 0 rgba(255,255,255,1),
      inset 0 -1px 0 rgba(0,0,0,.05);
  }

  [data-theme="light"] .button.btn-band:active{
    transform: translateY(0);
    background: #f8fafc !important;
    box-shadow:
      0 1px 2px rgba(0,0,0,.08),
      inset 0 1px 3px rgba(0,0,0,.07);
  }

  @media (prefers-reduced-motion: reduce){
    .button.btn-band{ transition:none; }
    .button.btn-band:hover{ transform:none; }
  }

  /* =========================
     Bandeau VOL 1 / VOL 2
     ========================= */
  .vol-header{
    position: relative;
    text-align: center;
    margin-bottom: 22px;
    padding: 10px 0;
    font-weight: 600;
    letter-spacing: .5px;
    color: rgba(255,255,255,.85);
  }

  [data-theme="light"] .vol-header{
    color: #374151;
  }

  .vol-header::before{
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.12),
      transparent
    );
    transform: translateY(-50%);
  }

  [data-theme="light"] .vol-header::before{
    background: linear-gradient(
      90deg,
      transparent,
      rgba(0,0,0,.10),
      transparent
    );
  }

  .vol-header span{
    position: relative;
    background: rgba(255,255,255,.06);
    padding: 6px 18px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow:
      0 4px 12px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.08);
  }

  [data-theme="light"] .vol-header span{
    background: #f1f5f9;
    border-color: rgba(0,0,0,.10);
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }

  .box h3.title{
    margin-bottom: 10px !important;
  }

  .tags{
    margin-top: 4px !important;
    margin-bottom: 16px !important;
  }

  /* Réserve la hauteur des badges */
  #arr_badges_1, #dep_badges_1,
  #arr_badges_2, #dep_badges_2{
    min-height: 32px;
    align-items: center;
  }

  #arr_badges_1:empty::before,
  #dep_badges_1:empty::before,
  #arr_badges_2:empty::before,
  #dep_badges_2:empty::before{
    content: "";
    display: inline-block;
    height: 24px;
  }

  /* =========================
     Toggle buttons Ménage
     ========================= */
  .menage-on{
    background: rgba(59,130,246,.18) !important;
    border-color: rgba(59,130,246,.45) !important;
    color: rgba(255,255,255,.92) !important;
    box-shadow: inset 0 0 0 1px rgba(59,130,246,.35);
    font-weight: 800;
  }

  /* =========================
     Header compact pour les modals
     ========================= */
  #rzaModal .vol-header,
  #siModal .vol-header,
  #menageModal .vol-header,
  #bbcgModal .vol-header{
    margin-bottom: 18px;
    padding: 6px 0;
  }

  #rzaModal .vol-header span,
  #siModal .vol-header span,
  #menageModal .vol-header span,
  #bbcgModal .vol-header span{
    padding: 4px 16px;
    font-size: 0.95rem;
  }

  /* =========================
     THEME VARIABLES
     ========================= */
  :root, [data-theme="light"]{
    --bg-page:        #f5f5f5;
    --bg-box:         #ffffff;
    --bg-input:       #ffffff;
    --text-main:      #363636;
    --text-label:     #363636;
    --text-help:      #7a7a7a;
    --border-input:   #dbdbdb;
    --border-box:     rgba(0,0,0,.06);
    --box-shadow:     0 2px 8px rgba(0,0,0,.08);
    --toggle-bg:      #e2e8f0;
    --toggle-icon:    "☀️";
  }

  [data-theme="dark"]{
    --bg-page:        #0f1117;
    --bg-box:         #1a1d27;
    --bg-input:       #232636;
    --text-main:      #e2e8f0;
    --text-label:     #cbd5e1;
    --text-help:      #94a3b8;
    --border-input:   #374151;
    --border-box:     rgba(255,255,255,.06);
    --box-shadow:     0 2px 12px rgba(0,0,0,.4);
    --toggle-bg:      #2d3748;
    --toggle-icon:    "🌙";
  }

  /* Application des variables */
  body{
    background: var(--bg-page) !important;
    color: var(--text-main) !important;
    transition: background .25s, color .25s;
    margin: 0;
    padding-bottom: 0;
  }

  .section{
    padding-bottom: 1.5rem;
  }

  .box{
    background: var(--bg-box) !important;
    border: 1px solid var(--border-box) !important;
    box-shadow: var(--box-shadow) !important;
    transition: background .25s, border-color .25s;
  }

  .input, .textarea, .select select{
    background: var(--bg-input) !important;
    color: var(--text-main) !important;
    border-color: var(--border-input) !important;
    transition: background .25s, color .25s, border-color .25s;
  }

  .input::placeholder, .textarea::placeholder{
    color: var(--text-help) !important;
    opacity: 1;
  }

  .label{
    color: var(--text-label) !important;
  }

  .help{
    color: var(--text-help) !important;
  }

  .title{
    color: var(--text-main) !important;
  }

  /* Checkboxes */
  [data-theme="dark"] .checkbox{
    color: var(--text-label);
  }

  /* Bulma overrides dark */
  [data-theme="dark"] .select::after{
    border-color: var(--text-help) !important;
  }

  [data-theme="dark"] .select select option{
    background: var(--bg-input);
    color: var(--text-main);
  }

  /* Modal box */
  [data-theme="dark"] .modal-overlay .box{
    background: #1e2130 !important;
    color: var(--text-main);
  }

  [data-theme="dark"] #akPopover{
    background: #1e2130;
    color: var(--text-main);
    border-color: var(--border-box);
  }

  [data-theme="dark"] #akPopover .ak-header{
    background: #1e2130;
    border-color: var(--border-box);
  }

  /* Toggle button */
  #themeToggle{
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 9999;
    background: var(--toggle-bg);
    border: none;
    border-radius: 999px;
    width: 42px;
    height: 42px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    transition: background .25s, transform .15s;
  }

  #themeToggle:hover{ transform: scale(1.1); }
  #themeToggle:active{ transform: scale(.95); }

  /* =========================
     Classes mutualisées modals
     ========================= */
  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
  }

  .modal-overlay{
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
</style>
</head>

<body>

<!-- Toggle jour / nuit -->
<button id="themeToggle" title="Basculer jour / nuit" aria-label="Basculer le thème">☀️</button>

<section class="section">
  <div class="container">

    <h1 class="title has-text-centered">Préparation des vols</h1>

    <div class="columns">

      <!-- ================= VOL 1 ================= -->
      <div class="column">

        <div class="box">
          <div class="vol-header">
            <span>VOL 1</span>
          </div>

          <!-- Liste AK (dans VOL 1) -->
          <div class="field mb-2">
            <div class="select is-fullwidth">
              <select id="ak_flow_1">
                <option value="DEP" selected>Départs</option>
                <option value="ARR">Arrivées</option>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="select is-fullwidth">
              <select id="ak_flight_1">
                <option value="">-- Choisir un vol --</option>
              </select>
            </div>
            <p class="help" id="ak_status_1">—</p>
          </div>

          <div class="columns mb-0">
            <div class="column pb-0">
              <h3 class="title is-6">ARRIVÉE</h3>
              <div class="tags mb-2" id="arr_badges_1"></div>
              <input id="arr_date_1" type="date" class="input mb-2">
              <input id="arr_flt_1" class="input mb-2" placeholder="Flight Number">
              <input id="arr_from_1" class="input mb-2" placeholder="From">
            </div>

            <div class="column pb-0">
              <h3 class="title is-6">DÉPART</h3>
              <div class="tags mb-2" id="dep_badges_1"></div>
              <input id="dep_date_1" type="date" class="input mb-2">
              <input id="dep_flt_1" class="input mb-2" placeholder="Flight Number">
              <input id="dep_to_1" class="input mb-2" placeholder="To">
            </div>
          </div>

          <input id="parking_1" class="input mb-2" placeholder="Parking">
          <input id="dep_reg_1" class="input mb-2" placeholder="Registration">
          <input id="dep_type_1" class="input mb-2" placeholder="A/C Type">
          <input id="arr_reg_1" type="hidden">
          <input id="arr_type_1" type="hidden">
        </div>

        <div class="box">
          <div class="doc-grid">
            <button class="button is-dark btn-band band-ryanair" data-doc="LIR_RYANAIR" data-vol="1">LIR Ryanair</button>
            <button class="button is-dark btn-band band-lauda" data-doc="LIR_LAUDA" data-vol="1">LIR Lauda</button>
            <button class="button is-dark btn-band" data-doc="BINGO_FR" data-vol="1">Bingo Gate</button>

            <button class="button is-dark btn-band band-gradient" data-doc="BBCG_GATE" data-vol="1">BBCG Gate</button>
            <button class="button is-dark btn-band band-gradient" data-doc="WAIF" data-vol="1">Walkaround</button>
            <button class="button is-dark btn-band band-gradient" data-doc="RTB" data-vol="1">Ready To Board</button>
          </div>
        </div>

      </div>

      <!-- ================= VOL 2 ================= -->
      <div class="column">

        <div class="box">
          <div class="vol-header">
            <span>VOL 2</span>
          </div>

          <!-- Liste AK (dans VOL 2) -->
          <div class="field mb-2">
            <div class="select is-fullwidth">
              <select id="ak_flow_2">
                <option value="DEP" selected>Départs</option>
                <option value="ARR">Arrivées</option>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="select is-fullwidth">
              <select id="ak_flight_2">
                <option value="">-- Choisir un vol --</option>
              </select>
            </div>
            <p class="help" id="ak_status_2">—</p>
          </div>

          <div class="columns mb-0">
            <div class="column pb-0">
              <h3 class="title is-6">ARRIVÉE</h3>
              <div class="tags mb-2" id="arr_badges_2"></div>
              <input id="arr_date_2" type="date" class="input mb-2">
              <input id="arr_flt_2" class="input mb-2" placeholder="Flight Number">
              <input id="arr_from_2" class="input mb-2" placeholder="From">
            </div>

            <div class="column pb-0">
              <h3 class="title is-6">DÉPART</h3>
              <div class="tags mb-2" id="dep_badges_2"></div>
              <input id="dep_date_2" type="date" class="input mb-2">
              <input id="dep_flt_2" class="input mb-2" placeholder="Flight Number">
              <input id="dep_to_2" class="input mb-2" placeholder="To">
            </div>
          </div>

          <input id="parking_2" class="input mb-2" placeholder="Parking">
          <input id="dep_reg_2" class="input mb-2" placeholder="Registration">
          <input id="dep_type_2" class="input mb-2" placeholder="A/C Type">
          <input id="arr_reg_2" type="hidden">
          <input id="arr_type_2" type="hidden">
        </div>

        <div class="box">
          <div class="doc-grid">
            <button class="button is-dark btn-band band-ryanair" data-doc="LIR_RYANAIR" data-vol="2">LIR Ryanair</button>
            <button class="button is-dark btn-band band-lauda" data-doc="LIR_LAUDA" data-vol="2">LIR Lauda</button>
            <button class="button is-dark btn-band" data-doc="BINGO_FR" data-vol="2">Bingo Gate</button>

            <button class="button is-dark btn-band band-gradient" data-doc="BBCG_GATE" data-vol="2">BBCG Gate</button>
            <button class="button is-dark btn-band band-gradient" data-doc="WAIF" data-vol="2">Walkaround</button>
            <button class="button is-dark btn-band band-gradient" data-doc="RTB" data-vol="2">Ready To Board</button>
          </div>
        </div>

      </div>
    </div>

    <div class="box">
      <div class="doc-grid">
        <button class="button is-dark btn-band" data-doc="AUTOCONTROLE" data-vol="both">Autocontrôle</button>
        <button class="button is-dark btn-band band-presta" data-doc="PRESTA_DEP" data-vol="both">Prestations départ</button>
        <button class="button is-dark btn-band band-presta" data-doc="PRESTA_RET" data-vol="both">Prestations arrivée</button>
      </div>
    </div>

  </div>
</section>

<!-- POPUP AK -->
<div id="akBackdrop" style="display:none;" onclick="closeAKMenu()"></div>
<div id="akPopover" style="display:none;">
  <div class="ak-header">
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <span class="tag is-light" id="akMenuTitle">AK</span>
      <button class="button is-small is-link" type="button" id="akMenuRefresh">Rafraîchir</button>
      <span class="tag is-light" id="akMenuStatus">—</span>
      <button class="button is-small is-light" style="margin-left:auto" onclick="closeAKMenu()">Fermer</button>
    </div>
  </div>
  <div id="akMenuList" style="margin-top:10px;"></div>
</div>

<!-- ===== RZA MODAL ===== -->
<div id="rzaBackdrop" class="modal-backdrop" style="display:none; z-index:6000;" onclick="window.closeRZAModal(false)"></div>

<div id="rzaModal" class="modal-overlay" style="display:none; z-index:6100;">
  <div class="box" style="width:min(420px, 100%); border-radius:16px;">

    <div class="vol-header">
      <span>Autocontrôle</span>
    </div>

    <div class="field">
      <label class="label">Nom et prénom du RZA :</label>
      <div class="control">
        <input id="rzaModalInput"
               class="input"
               type="text"
               autocomplete="off"
               spellcheck="false"
               placeholder="Nom Prénom">
      </div>
      <p class="help"
         id="rzaHelp"
         style="display:none; color:#ef4444; font-weight:800;">
        Merci de saisir le nom complet.
      </p>
    </div>

    <div class="buttons is-right">
      <button class="button is-light" type="button" id="rzaCancelBtn" onclick="window.closeRZAModal(false)">Annuler</button>
      <button class="button is-link"  type="button" id="rzaSubmitBtn" onclick="window.submitRZAModal()">Valider</button>
    </div>

  </div>
</div>

<!-- ===== SI MODAL (LIR Ryanair) ===== -->
<div id="siBackdrop" class="modal-backdrop" style="display:none; z-index:6200;" onclick="window.closeSIModal(false)"></div>

<div id="siModal" class="modal-overlay" style="display:none; z-index:6300;">
  <div class="box" style="width:min(520px, 100%); border-radius:16px;">

    <div class="vol-header">
      <span>LIR Ryanair</span>
    </div>

    <div class="field">
      <label class="label">Texte SI :</label>
      <div class="control">
        <textarea id="siModalInput"
                  class="textarea"
                  rows="5"
                  placeholder="Ex: Poussettes porte, poussettes CBS, wheelchair, bagages spéciaux, cargo etc."></textarea>
      </div>
      <p class="help">Tu peux laisser vide.</p>
    </div>

    <div class="field">
      <label class="checkbox">
        <input id="siModalHold" type="checkbox">
        HOLD SECURITY SEARCH
      </label>
    </div>

    <div class="field">
      <label class="checkbox">
        <input id="siModalMax5" type="checkbox">
        MAX 5 (B38M)
      </label>
    </div>

<script type="module" src="app.js"></script>

<script>
  (function(){
    const btn  = document.getElementById("themeToggle");
    const html = document.documentElement;

    function applyTheme(theme){
      html.setAttribute("data-theme", theme);
      btn.textContent = theme === "dark" ? "🌙" : "☀️";
      localStorage.setItem("theme", theme);
    }

    // Initialise l'icône selon le thème déjà appliqué (anti-flash)
    applyTheme(html.getAttribute("data-theme") || "light");

    btn.addEventListener("click", () => {
      applyTheme(html.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
  })();
</script>
