<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Flight PDF Filler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- BULMA -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
</head>

<body>

<section class="section">
<div class="container">

  <h1 class="title has-text-centered">Flight PDF Filler</h1>

  <!-- COMPANY -->
  <div class="box">
    <label class="label">Compagnie</label>
    <div class="select">
      <select id="company">
        <option value="FRRK">FR / RK</option>
        <option value="W6W4">W6 / W4</option>
      </select>
    </div>
  </div>

  <!-- ARR + DEP -->
  <div class="columns">

    <!-- ARRIVEE -->
    <div class="column">
      <div class="box">
        <h2 class="title is-4">ARRIVÉE</h2>

        <div class="field">
          <label class="label">Date</label>
          <div class="control">
            <input id="arr_date" type="date" class="input">
          </div>
        </div>

        <div class="field">
          <label class="label">Flight number</label>
          <input id="arr_flt" class="input">
        </div>

        <div class="field">
          <label class="label">From</label>
          <input id="arr_from" class="input">
        </div>

        <div class="field">
          <label class="label">Registration</label>
          <input id="arr_reg" class="input">
        </div>

        <div class="field">
          <label class="label">A/C type</label>
          <input id="arr_type" class="input">
        </div>

      </div>
    </div>

    <!-- DEPART -->
    <div class="column">
      <div class="box">
        <h2 class="title is-4">DÉPART</h2>

        <div class="field">
          <label class="label">Date</label>
          <input id="dep_date" type="date" class="input">
        </div>

        <div class="field">
          <label class="label">Flight number</label>
          <input id="dep_flt" class="input">
        </div>

        <div class="field">
          <label class="label">To</label>
          <input id="dep_to" class="input">
        </div>

        <div class="field">
          <label class="label">Registration</label>
          <input id="dep_reg" class="input">
        </div>

        <div class="field">
          <label class="label">A/C type</label>
          <input id="dep_type" class="input">
        </div>

      </div>
    </div>

  </div>

  <!-- DOCS FR -->
  <div class="box">
    <h2 class="title is-4">Documents FR / RK</h2>
    <div class="buttons">
      <button class="button is-dark" data-doc="LIR_RYANAIR">LIR Ryanair</button>
    </div>
  </div>

  <!-- DOCS W6 -->
  <div class="box">
    <h2 class="title is-4">Documents W6 / W4</h2>
    <div class="buttons">
      <button class="button is-link" data-doc="BBCG_GATE">Baggage bingo card gate</button>
      <button class="button is-link" data-doc="WAIF">Walkaround inspection</button>
      <button class="button is-link" data-doc="RTB">Ready to board</button>
    </div>
  </div>

</div>
</section>

<!-- PDF LIB -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<!-- TON SCRIPT -->
<script src="app.js"></script>

</body>
</html>
