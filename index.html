<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flight docs</title>
</head>
<body>

<button id="gen">Générer WAIF</button>

<script type="module">
import { PDFDocument } from "https://cdn.skypack.dev/pdf-lib";

const flight = {
  station: "BOD",
  arrFlightNumber: "W6 1234",
  arrDate: "04/02/2026",
  reg: "HA-LWK",
  arrivalInspector: "Hugo",
  depFlightNumber: "W6 5678",
  depDate: "04/02/2026",
  departureInspector: "Hugo",
};

async function generateWAIF() {

  const templateBytes = await fetch("./templates/WAIF_Jun2021_Rev1.1_ WALKAROUND INSPECTION FORM.pdf")
      .then(res => res.arrayBuffer());

  const pdfDoc = await PDFDocument.load(templateBytes);
  const form = pdfDoc.getForm();

  form.getTextField("station").setText(flight.station);
  form.getTextField("Arival flihht number").setText(flight.arrFlightNumber);
  form.getTextField("date x").setText(flight.arrDate);
  form.getTextField("reg").setText(flight.reg);
  form.getTextField("nam x").setText(flight.arrivalInspector);
  form.getTextField("departure").setText(flight.depFlightNumber);
  form.getTextField("date x2").setText(flight.depDate);
  form.getTextField("nam x 1").setText(flight.departureInspector);

  form.flatten();

  const pdfBytes = await pdfDoc.save();

  const blob = new Blob([pdfBytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  window.open(url);
}

document.getElementById("gen").onclick = generateWAIF;
</script>

</body>
</html>
