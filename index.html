<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Flight PDF Filler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">

  <style>
    :root{
      --bg: #f6f7fb;
      --card: rgba(255,255,255,.92);
      --stroke: rgba(16,24,40,.08);
      --shadow: 0 14px 34px rgba(16,24,40,.08);
      --shadow-sm: 0 8px 20px rgba(16,24,40,.08);
      --radius: 18px;
    }

    html, body { background: var(--bg); }

    .app-header{
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background: rgba(246,247,251,.75);
      border-bottom: 1px solid var(--stroke);
      padding: 16px 0;
      margin-bottom: 10px;
    }

    .app-title{
      letter-spacing: -0.02em;
      font-weight: 800;
    }

    .box{
      border-radius: var(--radius);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow-sm);
      background: var(--card);
    }

    .section { padding-top: 18px; }

    .input, .select select{
      border-radius: 14px;
      border: 1px solid rgba(16,24,40,.12);
      transition: .15s ease;
      background: rgba(255,255,255,.95);
    }

    .input:focus, .select select:focus{
      border-color: rgba(50,115,220,.55);
      box-shadow: 0 0 0 4px rgba(50,115,220,.12);
    }

    .label{ font-weight: 700; }

    .buttons .button{
      border-radius: 999px;
      padding-left: 14px;
      padding-right: 14px;
      box-shadow: 0 10px 18px rgba(16,24,40,.08);
      border: 1px solid rgba(16,24,40,.08);
    }

    .buttons .button.is-link,
    .buttons .button.is-dark,
    .buttons .button.is-warning{
      border: none;
    }

    .tags .tag{
      border-radius: 999px;
      font-weight: 700;
    }

    .help{ color: rgba(16,24,40,.55); }

    #akBackdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(2px);
      z-index: 4600;
    }

    #akPopover{
      position: fixed;
      inset: 10px;
      border-radius: 22px;
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      background: var(--card);
      z-index: 4700;
      padding: 12px;
      overflow: auto;
    }

    #akPopover .ak-header{
      position: sticky;
      top: 0;
      z-index: 2;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,.78);
      border-bottom: 1px solid var(--stroke);
      padding: 10px 0;
    }
  </style>
</head>

<body>

<div class="app-header">
  <div class="container">
    <h1 class="title has-text-centered app-title">Flight PDF Filler</h1>
  </div>
</div>

<section class="section">
  <div class="container">

    <!-- AGENT -->
    <div class="box">
      <h2 class="title is-4">Agent</h2>
      <div class="field">
        <label class="label">Nom Prénom</label>
        <input id="full_name" class="input" placeholder="DUPONT JEAN">
      </div>
    </div>

    <div class="columns">

      <!-- VOL 1 -->
      <div class="column">

        <div class="box">
          <h2 class="title is-5">Liste Vols</h2>

          <div class="field mb-2">
            <div class="select is-fullwidth">
              <select id="ak_flow_1">
                <option value="DEP" selected>Départs</option>
                <option value="ARR">Arrivées</option>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="select is-fullwidth">
              <select id="ak_flight_1">
                <option value="">-- Choisir un vol --</option>
              </select>
            </div>
            <p class="help" id="ak_status_1">—</p>
          </div>
        </div>

        <div class="box">
          <h2 class="title is-4">VOL 1 — ARRIVÉE</h2>
          <div class="tags mb-2" id="arr_badges_1"></div>

          <label class="checkbox mb-2">
            <input id="hold_search_1" type="checkbox">
            HOLD SECURITY SEARCH
          </label>

          <input id="arr_date_1" type="date" class="input mb-2">
          <input id="arr_flt_1" class="input mb-2" placeholder="Flight Number">
          <input id="arr_from_1" class="input mb-2" placeholder="From">
          <input id="arr_reg_1" class="input mb-2" placeholder="Registration">
          <input id="arr_type_1" class="input mb-2" placeholder="A/C Type">
        </div>

        <div class="box">
          <h2 class="title is-4">VOL 1 — DÉPART</h2>
          <div class="tags mb-2" id="dep_badges_1"></div>

          <input id="dep_date_1" type="date" class="input mb-2">
          <input id="dep_flt_1" class="input mb-2" placeholder="Flight number">
          <input id="dep_to_1" class="input mb-2" placeholder="To">
          <input id="parking_1" class="input mb-2" placeholder="Parking">
          <input id="dep_reg_1" class="input mb-2" placeholder="Registration">
          <input id="dep_type_1" class="input mb-2" placeholder="A/C Type">
        </div>

        <div class="box">
          <h2 class="title is-5">Documents VOL 1</h2>
          <div class="buttons">
            <button class="button is-dark" data-doc="LIR_RYANAIR" data-vol="1">LIR Ryanair</button>
            <button class="button is-dark" data-doc="LIR_LAUDA" data-vol="1">LIR Lauda</button>
            <button class="button is-dark" data-doc="BINGO_FR" data-vol="1">Bingo Gate</button>
            <button class="button is-link" data-doc="BBCG_GATE" data-vol="1">BBCG Gate</button>
            <button class="button is-link" data-doc="WAIF" data-vol="1">Walkaround</button>
            <button class="button is-link" data-doc="RTB" data-vol="1">Ready To Board</button>
          </div>
        </div>

      </div>

      <!-- VOL 2 -->
      <div class="column">

        <div class="box">
          <h2 class="title is-5">Liste Vols</h2>

          <div class="field mb-2">
            <div class="select is-fullwidth">
              <select id="ak_flow_2">
                <option value="DEP" selected>Départs</option>
                <option value="ARR">Arrivées</option>
              </select>
            </div>
          </div>

          <div class="field">
            <div class="select is-fullwidth">
              <select id="ak_flight_2">
                <option value="">-- Choisir un vol --</option>
              </select>
            </div>
            <p class="help" id="ak_status_2">—</p>
          </div>
        </div>

        <div class="box">
          <h2 class="title is-4">VOL 2 — ARRIVÉE</h2>
          <div class="tags mb-2" id="arr_badges_2"></div>

          <label class="checkbox mb-2">
            <input id="hold_search_2" type="checkbox">
            HOLD SECURITY SEARCH
          </label>

          <input id="arr_date_2" type="date" class="input mb-2">
          <input id="arr_flt_2" class="input mb-2" placeholder="Flight Number">
          <input id="arr_from_2" class="input mb-2" placeholder="From">
          <input id="arr_reg_2" class="input mb-2" placeholder="Registration">
          <input id="arr_type_2" class="input mb-2" placeholder="A/C Type">
        </div>

        <div class="box">
          <h2 class="title is-4">VOL 2 — DÉPART</h2>
          <div class="tags mb-2" id="dep_badges_2"></div>

          <input id="dep_date_2" type="date" class="input mb-2">
          <input id="dep_flt_2" class="input mb-2" placeholder="Flight Number">
          <input id="dep_to_2" class="input mb-2" placeholder="To">
          <input id="parking_2" class="input mb-2" placeholder="Parking">
          <input id="dep_reg_2" class="input mb-2" placeholder="Registration">
          <input id="dep_type_2" class="input mb-2" placeholder="A/C Type">
        </div>

        <div class="box">
          <h2 class="title is-5">Documents VOL 2</h2>
          <div class="buttons">
            <button class="button is-dark" data-doc="LIR_RYANAIR" data-vol="2">LIR Ryanair</button>
            <button class="button is-dark" data-doc="LIR_LAUDA" data-vol="2">LIR Lauda</button>
            <button class="button is-dark" data-doc="BINGO_FR" data-vol="2">Bingo Gate</button>
            <button class="button is-link" data-doc="BBCG_GATE" data-vol="2">BBCG Gate</button>
            <button class="button is-link" data-doc="WAIF" data-vol="2">Walkaround</button>
            <button class="button is-link" data-doc="RTB" data-vol="2">Ready To Board</button>
          </div>
        </div>

      </div>
    </div>

    <div class="box">
      <h2 class="title is-4">Documents 2 vols</h2>
      <div class="buttons">
        <button class="button is-warning" data-doc="AUTOCONTROLE" data-vol="both">Autocontrôle</button>
        <button class="button is-warning" data-doc="PRESTA_DEP" data-vol="both">Prestations départ</button>
        <button class="button is-warning" data-doc="PRESTA_RET" data-vol="both">Prestations arrivée</button>
      </div>
    </div>

  </div>
</section>

<div id="akBackdrop" style="display:none;" onclick="closeAKMenu()"></div>

<div id="akPopover" style="display:none;">
  <div class="ak-header">
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <span class="tag is-light" id="akMenuTitle">AK</span>
      <button class="button is-small is-link" type="button" id="akMenuRefresh">Rafraîchir</button>
      <span class="tag is-light" id="akMenuStatus">—</span>
      <button class="button is-small is-light" type="button" style="margin-left:auto" onclick="closeAKMenu()">Fermer</button>
    </div>
  </div>
  <div id="akMenuList" style="margin-top:10px;"></div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
