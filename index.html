<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Flight PDF Filler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family: Arial; max-width: 1000px; margin: 30px auto; }
    .grid { display:flex; gap:20px; }
    .box { border:1px solid #ccc; padding:20px; border-radius:12px; flex:1; }
    label { display:block; margin-top:10px; font-size:13px; }
    input, select { width:100%; padding:8px; margin-top:4px; }
    button { margin-top:12px; padding:10px 14px; cursor:pointer; }
    h1 { text-align:center; }
  </style>
</head>

<body>

<h1>Remplissage automatique PDF vol</h1>

<label>Compagnie</label>
<select id="company">
  <option value="FRRK">FR / RK</option>
  <option value="W6W4">W6 / W4</option>
</select>

<div class="grid">

  <div class="box">
    <h2>ARRIVÉE</h2>

    <label>Date</label>
    <input id="arr_date" type="date">

    <label>Flight number</label>
    <input id="arr_flt">

    <label>From</label>
    <input id="arr_from">

    <label>Registration</label>
    <input id="arr_reg">

    <label>A/C type</label>
    <input id="arr_type">
  </div>

  <div class="box">
    <h2>DÉPART</h2>

    <label>Date</label>
    <input id="dep_date" type="date">

    <label>Flight number</label>
    <input id="dep_flt">

    <label>To</label>
    <input id="dep_to">

    <label>Registration</label>
    <input id="dep_reg">

    <label>A/C type</label>
    <input id="dep_type">
  </div>

</div>

<h2>Documents FR / RK</h2>
<button data-doc="LIR_RYANAIR">LIR Ryanair</button>

<h2>Documents W6 / W4</h2>
<button data-doc="BBCG_GATE">Baggage bingo card gate</button>
<button data-doc="WAIF">Walkaround inspection</button>
<button data-doc="RTB">Ready to board</button>

<!-- LIB PDF -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<!-- TON SCRIPT -->
<script src="app.js"></script>

</body>
</html>
