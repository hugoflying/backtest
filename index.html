<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flight Docs</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 900px; margin: auto; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    button { padding: 10px 14px; cursor: pointer; }
    input { padding: 10px; width: 160px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-top: 16px; }
    label { display:block; margin-top: 10px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Flight Docs</h1>

  <div class="card">
    <h2>LIR Lauda</h2>
    <div class="row">
      <div>
        <label>Flight number</label>
        <input id="flightNumber" value="FR1234">
      </div>
      <div>
        <label>Registration</label>
        <input id="registration" value="EI-ABC">
      </div>
      <div>
        <label>Date</label>
        <input id="date" value="04 FEB 2026">
      </div>
      <div>
        <label>From</label>
        <input id="from" value="OPO">
      </div>
      <div>
        <label>To</label>
        <input id="to" value="DUB">
      </div>
    </div>

    <div style="margin-top:16px">
      <button id="btnLirLauda">Générer + Ouvrir PDF</button>
    </div>
  </div>

  <script type="module">
    import { PDFDocument, StandardFonts } from "https://cdn.skypack.dev/pdf-lib@1.17.1";

    // ⚠️ METS ICI TON URL PUBLIQUE R2 VERS LE PDF
    const TEMPLATE_URL = "MET_ICI_L_URL_PUBLIQUE_R2/templates/ryanair/lauda-lir.pdf";

    // Coordonnées (en mm depuis le haut) que tu as mesurées
    const pageHeightMm = 210;
    const MM_TO_PT = 2.834645669;
    const mmToPtX = (mm) => mm * MM_TO_PT;
    const mmTopToPtY = (yFromTopMm) => (pageHeightMm - yFromTopMm) * MM_TO_PT;

    const fieldsMm = {
      flightNumber: { x: 65.65,  yFromTop: 152.76, fontSize: 14 },
      registration: { x: 131.52, yFromTop: 152.76, fontSize: 14 },
      date:         { x: 179.14, yFromTop: 152.76, fontSize: 14 },
      from:         { x: 227.78, yFromTop: 152.76, fontSize: 14 },
      to:           { x: 271.47, yFromTop: 152.76, fontSize: 14 }
    };

    const getVal = (id) => document.getElementById(id).value ?? "";

    async function generateLirLauda() {
      const r = await fetch(TEMPLATE_URL);
      if (!r.ok) throw new Error("Impossible de télécharger le template PDF");
      const templateBytes = await r.arrayBuffer();

      const pdfDoc = await PDFDocument.load(templateBytes);
      const page = pdfDoc.getPage(0);
      const font = await pdfDoc.embedFont(StandardFonts.Helvetica);

      const draw = (key, value) => {
        const f = fieldsMm[key];
        page.drawText(value, {
          x: mmToPtX(f.x),
          y: mmTopToPtY(f.yFromTop),
          size: f.fontSize,
          font
        });
      };

      draw("flightNumber", getVal("flightNumber"));
      draw("registration", getVal("registration"));
      draw("date", getVal("date"));
      draw("from", getVal("from"));
      draw("to", getVal("to"));

      const out = await pdfDoc.save();
      const blob = new Blob([out], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    }

    document.getElementById("btnLirLauda").addEventListener("click", () => {
      generateLirLauda().catch(err => alert(err.message));
    });
  </script>
</body>
</html>
